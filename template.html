<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HSBC technical interview workbook: 3-day Python plan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
:root {
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #F4F6F9;
  --surface: #FFFFFF;
  --ink: #17212F;
  --muted: #556173;
  --line: #D8DEE7;
  --accent: #C8102E;
  --accent-soft: #FCEBEE;
  --learn: #0E5A6B;
  --learn-soft: #E3F0F3;
  --code-bg: #EDF0F5;
  --tok-c: #5B6879;
  --tok-s: #17704F;
  --tok-n: #A8500A;
  --tok-k: #2A56B5;
  --tok-d: #8A3FA8;
  --tok-b: #7A3FB0;
  --hdr: 60px;
  --sans: "Bricolage Grotesque", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D131E; --surface: #151D2B; --ink: #E7EBF1; --muted: #9AA5B7; --line: #26314A;
    --accent: #FF6A7E; --accent-soft: #2B1721; --learn: #63C7DA; --learn-soft: #10262D;
    --code-bg: #0A0F18; --tok-c: #7E8BA0; --tok-s: #6FD0A0; --tok-n: #F0A45D;
    --tok-k: #7FA8F5; --tok-d: #C58BE0; --tok-b: #C58BE0;
  }
}
:root[data-theme="dark"] {
  --bg: #0D131E; --surface: #151D2B; --ink: #E7EBF1; --muted: #9AA5B7; --line: #26314A;
  --accent: #FF6A7E; --accent-soft: #2B1721; --learn: #63C7DA; --learn-soft: #10262D;
  --code-bg: #0A0F18; --tok-c: #7E8BA0; --tok-s: #6FD0A0; --tok-n: #F0A45D;
  --tok-k: #7FA8F5; --tok-d: #C58BE0; --tok-b: #C58BE0;
}
*, *::before, *::after { box-sizing: inherit; }
html { scroll-padding-top: calc(env(safe-area-inset-top, 0px) + var(--hdr) + 12px); -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--serif); font-size: 17px; line-height: 1.7; }
h1, h2, h3, h4 { font-family: var(--sans); line-height: 1.2; margin: 0; letter-spacing: -0.01em; }
p { margin: 0 0 1em; max-width: 68ch; }
a { color: var(--learn); }
code { font-family: var(--mono); font-size: 0.86em; background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
.hdr { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--hdr); background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 14px; padding: 0 18px; }
.hdr .menu { display: none; font: 600 14px var(--sans); background: transparent; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px 12px; cursor: pointer; }
.hdr .brand { font: 700 17px var(--sans); white-space: nowrap; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.hdr .prog { margin-left: auto; display: flex; align-items: center; gap: 12px; font: 500 14px var(--sans); color: var(--muted); }
.bar { width: 140px; height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; }
.bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.25s ease; }

/* layout */
.app { display: grid; grid-template-columns: 290px minmax(0, 1fr); max-width: 1240px; margin: 0 auto; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--hdr)); align-self: start; height: calc(100vh - var(--hdr) - env(safe-area-inset-top, 0px)); overflow-y: auto; padding: 22px 16px 32px 20px; border-right: 1px solid var(--line); font-family: var(--sans); }
.rail h2 { font-size: 14px; font-weight: 700; margin: 18px 0 6px; color: var(--muted); }
.rail h2:first-child { margin-top: 0; }
.rail ul { list-style: none; margin: 0; padding: 0; }
.rail a { display: flex; justify-content: space-between; gap: 10px; padding: 7px 10px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 15px; line-height: 1.35; }
.rail a:hover { background: var(--line); }
.rail .count { font-size: 12px; color: var(--muted); white-space: nowrap; align-self: center; }
.rail li.complete .count { color: var(--learn); font-weight: 700; }
.rail li.complete a::before { content: "✓"; color: var(--learn); font-weight: 700; margin-right: -2px; }
.rail .reset { margin-top: 22px; font: 500 13px var(--sans); background: transparent; border: 1px solid var(--line); color: var(--muted); border-radius: 6px; padding: 7px 10px; cursor: pointer; }
main { padding: 28px 34px 80px; min-width: 0; }
.backdrop { display: none; }

/* intro */
.intro h1 { font-size: clamp(30px, 5vw, 46px); font-weight: 700; margin-bottom: 14px; max-width: 18ch; }
.intro .lead { font-size: 19px; color: var(--muted); }
.plan { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 26px 0 8px; }
.day { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 16px 8px; }
.day h3 { font-size: 20px; margin-bottom: 2px; }
.day .theme { font: 500 14px var(--sans); color: var(--muted); margin: 0 0 12px; }
.day ul { list-style: none; margin: 0; padding: 0; }
.day li { padding: 9px 0; border-top: 1px solid var(--line); font-size: 15px; line-height: 1.45; }
.day li b { display: block; font: 600 13px var(--sans); color: var(--accent); }
.rules { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px 6px; margin: 22px 0; }
.rules h3 { font-size: 19px; margin-bottom: 10px; }
.rules ol { margin: 0 0 12px; padding-left: 1.3em; }
.rules li { margin-bottom: 6px; }

/* modules */
.module { padding-top: 44px; margin-top: 44px; border-top: 2px solid var(--ink); }
.mod-head { margin-bottom: 20px; }
.mod-meta { display: flex; align-items: center; gap: 10px; margin: 0 0 8px; font: 500 14px var(--sans); color: var(--muted); }
.day-chip { background: var(--ink); color: var(--bg); border-radius: 999px; padding: 2px 11px; font-weight: 600; }
.module h2 { font-size: clamp(27px, 4vw, 36px); font-weight: 700; }
.module h3 { font-size: 21px; margin: 30px 0 10px; }
.module ul, .module ol { max-width: 68ch; padding-left: 1.3em; margin: 0 0 1em; }
.module li { margin-bottom: 0.35em; }
pre.code { margin: 14px 0 20px; padding: 14px 16px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; font-family: var(--mono); font-size: 14px; line-height: 1.55; tab-size: 4; max-width: 100%; }
pre.code code { background: none; padding: 0; font-size: inherit; }
pre.plain { margin: 14px 0 20px; padding: 14px 16px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; overflow-x: auto; font: 14px/1.55 var(--mono); }
.c { color: var(--tok-c); font-style: italic; } .s { color: var(--tok-s); } .n { color: var(--tok-n); }
.k { color: var(--tok-k); font-weight: 600; } .d { color: var(--tok-d); } .b { color: var(--tok-b); }
.tablewrap { overflow-x: auto; margin: 14px 0 22px; max-width: 100%; }
table { border-collapse: collapse; font: 15px/1.45 var(--sans); min-width: 100%; background: var(--surface); }
th, td { text-align: left; padding: 8px 12px; border: 1px solid var(--line); vertical-align: top; }
th { background: var(--code-bg); font-weight: 600; }
td code { white-space: nowrap; }
.tip { background: var(--learn-soft); border-left: 4px solid var(--learn); border-radius: 0 6px 6px 0; padding: 12px 18px 4px; margin: 20px 0; max-width: 72ch; }
.tip .tip-title { font: 700 15px var(--sans); color: var(--learn); margin: 0 0 6px; }

/* try it */
.try { background: var(--surface); border: 1px solid var(--line); border-left: 5px solid var(--accent); border-radius: 4px 10px 10px 4px; padding: 18px 20px 14px; margin: 28px 0; }
.try-head { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.try-head h3 { margin: 0; font-size: 20px; }
.badge { font: 600 12px var(--sans); color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 10px; }
.badge.level { color: var(--learn); background: var(--learn-soft); }
.try-body > :last-child { margin-bottom: 0.6em; }
details.solution { margin: 12px 0 8px; border-top: 1px dashed var(--line); padding-top: 12px; }
details.solution > summary { display: inline-block; cursor: pointer; list-style: none; font: 600 15px var(--sans); color: var(--learn); border: 1.5px solid var(--learn); border-radius: 6px; padding: 7px 14px; }
details.solution > summary::-webkit-details-marker { display: none; }
details.solution[open] > summary { background: var(--learn-soft); }
.sol-body { border-left: 3px solid var(--learn); padding-left: 16px; margin-top: 14px; }
.done { display: flex; align-items: center; gap: 10px; font: 500 15px var(--sans); cursor: pointer; margin-top: 8px; width: fit-content; }
.done input { width: 20px; height: 20px; accent-color: var(--accent); cursor: pointer; }

/* Q&A */
.qaset { margin: 26px 0; }
.qa-hint { font: 500 15px var(--sans); color: var(--muted); }
details.qa { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; margin-bottom: 8px; }
details.qa > summary { cursor: pointer; list-style: none; padding: 12px 44px 12px 16px; font: 600 16px/1.4 var(--sans); position: relative; }
details.qa > summary::-webkit-details-marker { display: none; }
details.qa > summary::after { content: "+"; position: absolute; right: 16px; top: 8px; font-size: 22px; color: var(--accent); }
details.qa[open] > summary::after { content: "–"; }
details.qa[open] > summary { border-bottom: 1px solid var(--line); }
details.qa > div { padding: 12px 16px 2px; }
details.qa > div > :last-child { margin-bottom: 0.9em; }

@media (max-width: 920px) {
  .hdr .menu { display: inline-block; }
  .hdr .brand { font-size: 15px; overflow: hidden; text-overflow: ellipsis; }
  .bar { width: 70px; }
  .app { display: block; }
  .rail { position: fixed; z-index: 40; top: 0; left: 0; bottom: 0; height: auto; width: min(320px, 86vw); background: var(--surface); padding-top: calc(env(safe-area-inset-top, 0px) + 18px); padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 24px); transform: translateX(-102%); transition: transform 0.2s ease; }
  body.rail-open .rail { transform: none; }
  body.rail-open .backdrop { display: block; position: fixed; inset: 0; z-index: 35; background: rgba(0, 0, 0, 0.45); }
  main { padding: 22px 16px 70px; }
  .plan { grid-template-columns: 1fr; }
  body { font-size: 16.5px; }
}
@media (prefers-reduced-motion: reduce) { .bar > i, .rail { transition: none; } }
</style>
</head>
<body>
<header class="hdr">
  <button class="menu" type="button" aria-label="Open contents">Contents</button>
  <span class="brand">HSBC technical round workbook</span>
  <div class="prog" aria-live="polite"><span id="progText">0 of 0 done</span><div class="bar"><i id="progBar"></i></div></div>
</header>
<div class="backdrop"></div>
<div class="app">
<nav class="rail" aria-label="Modules">
{{SIDEBAR}}
<button class="reset" type="button">Reset progress</button>
</nav>
<main>
{{CONTENT}}
</main>
</div>
<script>
(function () {
  var KEY = "hsbc-workbook-progress-v1", state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { state = {}; }
  var boxes = [].slice.call(document.querySelectorAll("input[data-done]"));
  function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }
  function update() {
    var done = boxes.filter(function (b) { return b.checked; }).length;
    document.getElementById("progText").textContent = done + " of " + boxes.length + " done";
    document.getElementById("progBar").style.width = (boxes.length ? (100 * done / boxes.length) : 0) + "%";
    [].slice.call(document.querySelectorAll(".module")).forEach(function (m) {
      var bs = [].slice.call(m.querySelectorAll("input[data-done]"));
      var d = bs.filter(function (b) { return b.checked; }).length;
      var li = document.querySelector('.rail li[data-mod="' + m.id + '"]');
      if (!li) return;
      li.querySelector(".count").textContent = bs.length ? d + "/" + bs.length : "";
      li.classList.toggle("complete", bs.length > 0 && d === bs.length);
    });
  }
  boxes.forEach(function (b) {
    b.checked = !!state[b.getAttribute("data-done")];
    b.addEventListener("change", function () { state[b.getAttribute("data-done")] = b.checked; save(); update(); });
  });
  update();
  var body = document.body;
  document.querySelector(".menu").addEventListener("click", function () { body.classList.toggle("rail-open"); });
  document.querySelector(".backdrop").addEventListener("click", function () { body.classList.remove("rail-open"); });
  [].slice.call(document.querySelectorAll(".rail a")).forEach(function (a) { a.addEventListener("click", function () { body.classList.remove("rail-open"); }); });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") body.classList.remove("rail-open"); });
  var reset = document.querySelector(".reset"), armed = false, t;
  reset.addEventListener("click", function () {
    if (!armed) { armed = true; reset.textContent = "Click again to confirm"; t = setTimeout(function () { armed = false; reset.textContent = "Reset progress"; }, 3000); return; }
    clearTimeout(t); armed = false; reset.textContent = "Reset progress"; state = {};
    boxes.forEach(function (b) { b.checked = false; }); save(); update();
  });
})();
</script>
</body>
</html>
